name: Build Androcode APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Androcode-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/Androcode.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Androcode-apk
          path: dist/Androcode.apk

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          target_commitish: ${{ github.sha }}
          name: Androcode ${{ steps.ver.outputs.name }}
          files: dist/Androcode.apk
          make_latest: true
          body: |
            ## Androcode ${{ steps.ver.outputs.name }}

            **Install:** download `Androcode.apk` below, allow installs from unknown sources, open it.
            Requires **Android 12+**; root (Magisk / KernelSU / APatch) recommended.

            > Root gives the agent full control of the device — read commands before approving.
            > If you have an older Androcode build installed, uninstall it first (different signing key).
