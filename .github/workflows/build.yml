name: Build AndroCode APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java 17 (нужна для Android Gradle Plugin 8.5+)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Устанавливаем Gradle 8.7 (чтобы сборка работала даже без файла gradlew)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Собираем Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # 5. Загружаем готовый APK в Artifacts, чтобы его можно было скачать
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroCode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
